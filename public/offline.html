<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>우리 동네 카페 지도</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
        background: #f9fafb;
        color: #111827;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .card {
        max-width: 320px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.125rem;
        font-weight: 600;
      }
      p {
        margin: 0;
        font-size: 0.875rem;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>인터넷 연결이 필요합니다</h1>
      <p>지도와 로그인 정보를 불러오려면 인터넷에 연결한 뒤 다시 시도해주세요.</p>
    </div>
  </body>
</html>
